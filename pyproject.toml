[project]
name = "cursor-linux-tg-bot"
version = "1.0.6"
description = "Telegram bot that forwards messages to a local Cursor agent on Linux"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cursor-sdk>=0.1.8",
    "python-telegram-bot>=21.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "faster-whisper>=1.0",
]

[project.scripts]
cursor-linux-tg-bot = "cursor_linux_tg_bot.bot:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
