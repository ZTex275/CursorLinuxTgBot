# Скопируйте в config.yaml и заполните значения.
# Секреты можно задавать через переменные окружения: ${TELEGRAM_BOT_TOKEN}

telegram:
  token: ${TELEGRAM_BOT_TOKEN}
  force_ipv4: true
  connect_timeout: 30
  read_timeout: 30
  # Ваш numeric user id из @userinfobot — только эти пользователи смогут писать боту
  allowed_user_ids:
    - 123456789

# ВКонтакте (опционально, работает параллельно с Telegram).
# 1) Управление → Работа с API → Ключи доступа
#    Права: «Сообщения сообщества» + «Управление сообществом»
# 2) Работа с API → Long Poll API → Включить → «Входящее сообщение», v5.199
# 3) Сообщения сообщества: Включены (в настройках сообщества)
vk:
  token: ${VK_BOT_TOKEN}
  group_id: 0            # числовой id сообщества (без минуса)
  allowed_user_ids: []   # numeric id пользователей VK; пусто = разрешить всем
  connect_timeout: 30
  read_timeout: 30

agent:
  # cursor — Cursor Agent CLI; openrouter — OpenRouter API + локальные tools;
  # openrouter_cli — внешний CLI orc (https://github.com/Ikarza/openrouter-cli)
  provider: cursor
  # Общий workspace (если не задан — берётся из cursor.workspace)
  # workspace: /home/YOUR_USER
  mode: agent

cursor:
  api_key: ${CURSOR_API_KEY}
  model: composer-2.5
  # Рабочая директория на Linux-сервере, которой управляет агент
  workspace: /home/YOUR_USER
  # agent — выполняет команды; plan — сначала план без изменений
  mode: agent
  # Пустой список = только inline-настройки SDK (без .cursor/rules из окружения)
  setting_sources: []

openrouter:
  api_key: ${OPENROUTER_API_KEY}
  model: openrouter/free
  base_url: https://openrouter.ai/api/v1
  max_tool_rounds: 25
  # site_url: https://example.com
  # app_name: cursor-linux-tg-bot

openrouter_cli:
  api_key: ${OPENROUTER_API_KEY}
  # model: anthropic/claude-3-sonnet-20240229   # если пусто — модели из profile
  profile: default
  binary: orc
  # extra_args: []

bot:
  welcome_message: |
    Привет! Я прокси к локальному Cursor Agent на этом сервере.
    Просто напишите задачу — агент выполнит её на Linux.
    /new — новая сессия, /mode agent|plan, /provider cursor|openrouter|openrouter_cli, /model <модель>, /status — настройки.
    /commit — зафиксировать изменения в git, /undo — откатить последнее сообщение.
    /stop — прервать текущую задачу, откатить её изменения и очистить очередь.
    /git — статус репозитория, /push и /pull — синхронизация с GitHub.
    Можно писать несколько сообщений подряд — они выполнятся по очереди. /queue — размер очереди.
  system_prefix: |
    Пользователь управляет этим Linux-сервером через Telegram.
    Выполняй запросы на этой машине. Кратко отвечай по-русски.
  max_reply_length: 4000
  stream_edit_interval_sec: 2.0
  max_queue_size: 100   # макс. сообщений в очереди на один чат

git:
  enabled: true
  # После каждого успешного ответа агента — git commit с текстом сообщения
  auto_commit: true
  # После коммита — git push (нужен GITHUB_TOKEN в .env)
  auto_push: true
  remote: origin
  branch: ""
  github_token: ${GITHUB_TOKEN}
  commit_prefix: "tg: "
  max_commit_message_length: 120

# Сессии агента (локально в репозитории)
sessions_dir: data/sessions
